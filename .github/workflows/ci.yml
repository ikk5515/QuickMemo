name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Functions-free security guard
        run: npm run security:functions-guard

      - name: Sensitive-file gitignore guard
        run: npm run security:gitignore-guard

      - name: Zero-cost dependency and runtime guard
        run: npm run security:billing-guard

      - name: Dependency audit
        run: npm audit

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Secure Share API emulator integration
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Secure Share and Graph performance benchmarks
        run: npm run test:performance

      - name: Secure Share browser E2E
        run: npm run test:e2e

      - name: Encrypted Vault browser E2E
        run: npm run test:e2e:vault

      - name: Build encrypted Vault bundle with the release flag enabled
        env:
          VITE_OBSIDIAN_VAULT_ENABLED: "true"
        run: npm run build

      - name: Build
        run: npm run build
