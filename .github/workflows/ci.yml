name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, security, rules, performance, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Functions-free security guard
        run: npm run security:functions-guard

      - name: Sensitive-file gitignore guard
        run: npm run security:gitignore-guard

      - name: Zero-cost dependency and runtime guard
        run: npm run security:billing-guard

      - name: Dependency audit
        run: npm audit

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Secure Share API emulator integration
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Secure Share and Graph performance benchmarks
        run: npm run test:performance

      - name: Build encrypted Vault bundle with the release flag enabled
        env:
          VITE_OBSIDIAN_VAULT_ENABLED: "true"
        run: npm run build:artifacts

      - name: Build
        run: npm run build:artifacts

  browser_e2e:
    name: Browser E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Secure Share
            browsers: chromium webkit
            command: npm run test:e2e
          - label: Encrypted Vault Chromium desktop
            browsers: chromium
            command: npm run test:e2e:vault -- --project=vault-chromium-desktop-1440 --project=vault-chromium-desktop-1280
          - label: Encrypted Vault Chromium responsive
            browsers: chromium
            command: npm run test:e2e:vault -- --project=vault-chromium-tablet-1024 --project=vault-chromium-tablet-768 --project=vault-chromium-mobile-390 --project=vault-chromium-mobile-320
          - label: Encrypted Vault WebKit
            browsers: webkit
            command: npm run test:e2e:vault -- --project=vault-webkit-desktop-1280 --project=vault-webkit-mobile-390 --project=vault-webkit-mobile-320
          - label: Encrypted Vault Firefox
            browsers: firefox
            command: QUICKMEMO_E2E_EXTRA_BROWSERS=true npm run test:e2e:vault -- --project=vault-firefox-desktop-1280
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Run browser suite
        run: ${{ matrix.command }}

  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - quality
      - browser_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          BROWSER_E2E_RESULT: ${{ needs.browser_e2e.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${QUALITY_RESULT}" != "success" || "${BROWSER_E2E_RESULT}" != "success" ]]; then
            echo "One or more required CI gates failed, were cancelled, or were skipped." >&2
            exit 1
          fi
