name: Vercel Production Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'master' }}
    concurrency:
      group: vercel-production-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment commit is current master
        id: master_at_start
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_line="$(git ls-remote --exit-code origin refs/heads/master)"
          current_master_sha="${remote_line%%[[:space:]]*}"
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || [[ ! "${current_master_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to validate the trusted master commit." >&2
            exit 1
          fi
          if [[ "${current_master_sha}" == "${EXPECTED_SHA}" ]]; then
            printf 'current=true\n' >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipping a stale successful CI run because master has advanced."
            printf 'current=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node
        if: steps.master_at_start.outputs.current == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify committed patch whitespace
        if: steps.master_at_start.outputs.current == 'true'
        run: git diff --check HEAD^ HEAD

      - name: Verify attested Firebase and Vault release contract
        if: steps.master_at_start.outputs.current == 'true'
        id: release_contract
        env:
          FIREBASE_DEPLOYED_RULES_INDEXES_SHA256: ${{ vars.FIREBASE_DEPLOYED_RULES_INDEXES_SHA256 }}
          FIREBASE_SPARK_ATTESTATION: ${{ vars.FIREBASE_SPARK_ATTESTATION }}
          VAULT_RELEASE_STATE: ${{ vars.VAULT_RELEASE_STATE }}
        run: node scripts/verify-production-release-contract.mjs --verify

      - name: Verify Secure Share live-sync firewall gate
        if: steps.master_at_start.outputs.current == 'true' && steps.release_contract.outputs.contract_verified == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-vercel-firewall-rate-limit.mjs --probe

      - name: Verify zero-cost Vercel Hobby plan and enabled Vault flag
        if: steps.master_at_start.outputs.current == 'true' && steps.release_contract.outputs.contract_verified == 'true' && steps.release_contract.outputs.vault_enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-vercel-hobby-plan.mjs --probe --expect-vault-enabled

      - name: Verify zero-cost Vercel Hobby plan and disabled Vault flag
        if: steps.master_at_start.outputs.current == 'true' && steps.release_contract.outputs.contract_verified == 'true' && steps.release_contract.outputs.vault_enabled == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/verify-vercel-hobby-plan.mjs --probe --expect-vault-disabled

      - name: Revalidate master immediately before deployment
        if: steps.master_at_start.outputs.current == 'true' && steps.release_contract.outputs.contract_verified == 'true' && (steps.release_contract.outputs.vault_enabled == 'true' || steps.release_contract.outputs.vault_enabled == 'false')
        id: master_before_deploy
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_line="$(git ls-remote --exit-code origin refs/heads/master)"
          current_master_sha="${remote_line%%[[:space:]]*}"
          if [[ ! "${current_master_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to revalidate the trusted master commit." >&2
            exit 1
          fi
          if [[ "${current_master_sha}" == "${EXPECTED_SHA}" ]]; then
            printf 'current=true\n' >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipping deployment because master advanced during preflight."
            printf 'current=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy
        if: steps.master_before_deploy.outputs.current == 'true' && steps.release_contract.outputs.contract_verified == 'true' && (steps.release_contract.outputs.vault_enabled == 'true' || steps.release_contract.outputs.vault_enabled == 'false')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@54.4.1 deploy --prod --yes
